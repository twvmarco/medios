<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050a18; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  @keyframes pulse-ring {
    0%   { r: 110; stroke-opacity: 0.5; }
    100% { r: 145; stroke-opacity: 0; }
  }
  @keyframes pulse-ring2 {
    0%   { r: 110; stroke-opacity: 0.35; }
    100% { r: 160; stroke-opacity: 0; }
  }
  @keyframes data-flow {
    0%   { stroke-dashoffset: 200; opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  @keyframes node-glow {
    0%, 100% { filter: drop-shadow(0 0 4px #00d4ff88); }
    50%       { filter: drop-shadow(0 0 12px #00d4ffcc); }
  }
  @keyframes center-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .pulse1 { animation: pulse-ring  2.5s ease-out infinite; fill: none; stroke: #00d4ff; stroke-width: 1; }
  .pulse2 { animation: pulse-ring2 2.5s ease-out infinite 1.25s; fill: none; stroke: #00ffcc; stroke-width: 0.5; }
  .edge { stroke: #00d4ff; stroke-width: 1; fill: none; opacity: 0.25; }
  .flow1 { stroke: #00d4ff; stroke-width: 1.5; fill: none; stroke-dasharray: 8 200; stroke-dashoffset: 200; animation: data-flow 2.2s ease-in-out infinite 0.0s; }
  .flow2 { stroke: #00ffcc; stroke-width: 1.5; fill: none; stroke-dasharray: 8 200; stroke-dashoffset: 200; animation: data-flow 2.2s ease-in-out infinite 0.55s; }
  .flow3 { stroke: #a78bfa; stroke-width: 1.5; fill: none; stroke-dasharray: 8 200; stroke-dashoffset: 200; animation: data-flow 2.2s ease-in-out infinite 1.1s; }
  .flow4 { stroke: #00d4ff; stroke-width: 1.5; fill: none; stroke-dasharray: 8 200; stroke-dashoffset: 200; animation: data-flow 2.2s ease-in-out infinite 1.65s; }
  .flow5 { stroke: #00ffcc; stroke-width: 1.5; fill: none; stroke-dasharray: 8 200; stroke-dashoffset: 200; animation: data-flow 2.2s ease-in-out infinite 2.2s; }
  .node-group { animation: node-glow 3s ease-in-out infinite; }
  .node-group:nth-child(2) { animation-delay: 0.5s; }
  .node-group:nth-child(3) { animation-delay: 1.0s; }
  .node-group:nth-child(4) { animation-delay: 1.5s; }
  .node-group:nth-child(5) { animation-delay: 2.0s; }
  .center-ring {
    transform-origin: 170px 170px;
    animation: center-spin 12s linear infinite;
  }
</style>
</head>
<body>
<svg width="340" height="340" viewBox="0 0 340 340">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050a18"/>
    </radialGradient>
    <radialGradient id="node-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <radialGradient id="center-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#005577"/>
      <stop offset="100%" stop-color="#002233"/>
    </radialGradient>
  </defs>

  <circle cx="170" cy="170" r="160" fill="url(#bg-grad)"/>
  <circle class="pulse1" cx="170" cy="170" r="110"/>
  <circle class="pulse2" cx="170" cy="170" r="110"/>

  <g class="center-ring">
    <circle cx="170" cy="170" r="110" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-dasharray="4 10" stroke-opacity="0.2"/>
  </g>

  <!-- Edges -->
  <line class="edge" x1="170" y1="170" x2="170" y2="60"/>
  <line class="edge" x1="170" y1="170" x2="270" y2="100"/>
  <line class="edge" x1="170" y1="170" x2="268" y2="248"/>
  <line class="edge" x1="170" y1="170" x2="72"  y2="248"/>
  <line class="edge" x1="170" y1="170" x2="70"  y2="100"/>
  <line class="edge" x1="170" y1="60"  x2="270" y2="100"/>
  <line class="edge" x1="270" y1="100" x2="268" y2="248"/>
  <line class="edge" x1="268" y1="248" x2="72"  y2="248"/>
  <line class="edge" x1="72"  y1="248" x2="70"  y2="100"/>
  <line class="edge" x1="70"  y1="100" x2="170" y2="60"/>

  <!-- Data flows -->
  <line class="flow1" x1="170" y1="170" x2="170" y2="60"/>
  <line class="flow2" x1="270" y1="100" x2="170" y2="170"/>
  <line class="flow3" x1="170" y1="170" x2="268" y2="248"/>
  <line class="flow4" x1="72"  y1="248" x2="170" y2="170"/>
  <line class="flow5" x1="170" y1="170" x2="70"  y2="100"/>

  <!-- Nodo: PC (arriba) -->
  <g class="node-group">
    <circle cx="170" cy="60" r="18" fill="url(#node-grad)" stroke="#00d4ff" stroke-width="1.5"/>
    <circle cx="170" cy="60" r="10" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="3 3"/>
    <rect x="163" y="53" width="14" height="10" rx="1.5" fill="none" stroke="#00d4ff" stroke-width="1.2"/>
    <line x1="167" y1="63" x2="173" y2="63" stroke="#00d4ff" stroke-width="1.2"/>
    <line x1="167" y1="65" x2="173" y2="65" stroke="#00d4ff" stroke-width="1.2"/>
  </g>

  <!-- Nodo: Servidor (derecha arriba) -->
  <g class="node-group">
    <circle cx="270" cy="100" r="18" fill="url(#node-grad)" stroke="#00ffcc" stroke-width="1.5"/>
    <rect x="263" y="93" width="14" height="14" rx="1.5" fill="none" stroke="#00ffcc" stroke-width="1.2"/>
    <line x1="263" y1="97" x2="277" y2="97" stroke="#00ffcc" stroke-width="1"/>
    <line x1="263" y1="101" x2="277" y2="101" stroke="#00ffcc" stroke-width="1"/>
    <circle cx="274" cy="95" r="1" fill="#00ffcc"/>
    <circle cx="274" cy="99" r="1" fill="#00ffcc"/>
  </g>

  <!-- Nodo: WiFi (derecha abajo) -->
  <g class="node-group">
    <circle cx="268" cy="248" r="18" fill="url(#node-grad)" stroke="#a78bfa" stroke-width="1.5"/>
    <path d="M261 254 Q268 244 275 254" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M264 251 Q268 245 272 251" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="268" cy="253" r="1.5" fill="#a78bfa"/>
  </g>

  <!-- Nodo: Nube (izquierda abajo) -->
  <g class="node-group">
    <circle cx="72" cy="248" r="18" fill="url(#node-grad)" stroke="#00d4ff" stroke-width="1.5"/>
    <path d="M65 252 Q64 244 70 244 Q71 240 76 241 Q80 240 80 245 Q83 245 83 249 Q83 253 80 253 Z" fill="none" stroke="#00d4ff" stroke-width="1.2"/>
  </g>

  <!-- Nodo: Celular (izquierda arriba) -->
  <g class="node-group">
    <circle cx="70" cy="100" r="18" fill="url(#node-grad)" stroke="#00ffcc" stroke-width="1.5"/>
    <rect x="64" y="92" width="12" height="16" rx="2" fill="none" stroke="#00ffcc" stroke-width="1.2"/>
    <line x1="67" y1="105" x2="73" y2="105" stroke="#00ffcc" stroke-width="1.2"/>
  </g>

  <!-- Centro: Router -->
  <circle cx="170" cy="170" r="28" fill="url(#center-grad)" stroke="#00d4ff" stroke-width="2"/>
  <circle cx="170" cy="170" r="22" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="3 5" stroke-opacity="0.5"/>
  <rect x="160" y="164" width="20" height="12" rx="2" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="165" cy="162" r="1.5" fill="#00d4ff"/>
  <circle cx="170" cy="161" r="1.5" fill="#00d4ff"/>
  <circle cx="175" cy="162" r="1.5" fill="#00d4ff"/>
  <circle cx="164" cy="170" r="1" fill="#00d4ff"/>
  <circle cx="168" cy="170" r="1" fill="#00d4ff"/>
  <circle cx="172" cy="170" r="1" fill="#00d4ff"/>
  <circle cx="176" cy="170" r="1" fill="#00d4ff"/>

  <!-- Label -->
  <text x="170" y="310" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00d4ff" letter-spacing="3" opacity="0.7">RED LOCAL</text>
</svg>
</body>
</html>
